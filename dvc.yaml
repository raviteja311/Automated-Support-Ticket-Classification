stages:
  generate:
    cmd: python -m automated_support_ticket_classification.data.generate
    deps:
      - src/automated_support_ticket_classification/data/generate.py
      - src/automated_support_ticket_classification/data/banking77.py
      - src/automated_support_ticket_classification/config.py
      - src/automated_support_ticket_classification/logger.py
    params:
      - data.n_samples
      - data.random_state
      - data.source
    outs:
      - data/raw/tickets.csv

  preprocess:
    cmd: python -m automated_support_ticket_classification.data.preprocess
    deps:
      - src/automated_support_ticket_classification/data/preprocess.py
      - src/automated_support_ticket_classification/config.py
      - src/automated_support_ticket_classification/logger.py
      - data/raw/tickets.csv
    params:
      - data.test_size
      - data.random_state
      - data.split
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python -m automated_support_ticket_classification.models.train
    deps:
      - src/automated_support_ticket_classification/models/train.py
      - src/automated_support_ticket_classification/config.py
      - src/automated_support_ticket_classification/logger.py
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - model.max_features
      - model.ngram_max
      - model.C
      - model.max_iter
    outs:
      - models/model.joblib

  evaluate:
    cmd: python -m automated_support_ticket_classification.models.evaluate
    deps:
      - src/automated_support_ticket_classification/models/evaluate.py
      - src/automated_support_ticket_classification/config.py
      - src/automated_support_ticket_classification/logger.py
      - models/model.joblib
      - data/processed/test.csv
    metrics:
      - metrics/metrics.json:
          cache: false
    # Committed to git, not the DVC cache: small, and read in review.
    outs:
      - reports/confusion_matrix.csv:
          cache: false
      - reports/confusion_matrix.png:
          cache: false
      - reports/errors.csv:
          cache: false

  baselines:
    cmd: python -m automated_support_ticket_classification.models.baselines
    deps:
      - src/automated_support_ticket_classification/models/baselines.py
      - src/automated_support_ticket_classification/models/train.py
      - src/automated_support_ticket_classification/config.py
      - src/automated_support_ticket_classification/logger.py
      - models/model.joblib
      - data/processed/train.csv
      - data/processed/test.csv
    params:
      - model.max_features
      - model.ngram_max
      - model.C
      - data.random_state
    metrics:
      - metrics/baselines.json:
          cache: false
