data:
  raw_path: data/raw/tickets.csv
  processed_dir: data/processed
  n_samples: 3000
  test_size: 0.2
  random_state: 42
  # synthetic = seeded templates; banking77 = real support corpus
  source: banking77
  cache_dir: data/external
  # official = banking77's published train/test files (10,003 / 3,080 rows);
  # random = stratified re-split by test_size. synthetic needs random.
  split: official
model:
  max_features: 5000
  # 1 = unigrams only, 2 = unigrams + bigrams
  ngram_max: 2
  C: 1.0
  max_iter: 1000
  model_path: models/model.joblib
evaluate:
  metrics_path: metrics/metrics.json
  # Majority-class and alternative models on the same split and features
  baselines_path: metrics/baselines.json
monitoring:
  predictions_path: data/predictions.jsonl
  # Mask emails and long digit runs (card, account numbers) before logging
  redact: true
  # Rotate the log at this size in bytes; 0 disables rotation
  max_bytes: 5000000
  backup_count: 3