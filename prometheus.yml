global:
  scrape_interval: 15s

# Alert rules, mounted into the container by docker-compose.yml.
rule_files:
  - /etc/prometheus/rules/rules.yml

scrape_configs:
  - job_name: automated-support-ticket-classification
    metrics_path: /metrics
    static_configs:
      # "api" is the compose service name. Inside the compose network
      # localhost would mean the Prometheus container itself, not the API.
      - targets: ["api:8000"]
