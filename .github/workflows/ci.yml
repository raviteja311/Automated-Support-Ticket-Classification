name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          # Matches the Dockerfile and the local venv. Three environments,
          # one interpreter version.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install -e .

      # Format before lint: it is the cheaper check and the one that fails
      # most often, so it reports first.
      - name: Format check
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      # No model artifact exists on a fresh runner. tests/conftest.py builds
      # a small one on demand, which is what makes the suite self-sufficient.
      - name: Tests
        run: pytest

  docker-build:
    runs-on: ubuntu-latest
    # Only build once the cheap checks pass. Lint takes seconds; this build
    # trains a model, so there is no point running it on failing code.
    needs: lint-and-test
    steps:
      - uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t automated-support-ticket-classification:ci .

      - name: Smoke test the image
        run: |
          docker run -d --name ci-api -p 8000:8000 automated-support-ticket-classification:ci
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:8000/health && break
            sleep 2
          done
          curl -sf http://127.0.0.1:8000/health | grep -q '"status":"ok"'
          docker rm -f ci-api
